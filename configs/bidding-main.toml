[study]
name = "bidding-prediction-error"
purpose = "custom-fixed-opponent-study"
training_seeds = [11, 23, 37]
train_markets = [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016]
validation_markets = [2001, 2002, 2003, 2004, 2005, 2006]
test_markets = [3101, 3102, 3103, 3104, 3105, 3106, 3107, 3108, 3109, 3110, 3111, 3112]
focal_agents = [0, 8, 16, 24, 32, 40]
pv_count = 500000
actions = [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
biases = [0.75, 1.0, 1.25, 1.5]

[training]
device = "mps"
threads = 2
width = 128
layers = 2
heads = 4
context = 24
steps = 15000
batch_size = 32
learning_rate = 0.0003
checkpoint_every = 1000
log_every = 250

[evaluation]
scenarios = ["calibrated", "over_25", "over_50", "under_25", "mid_over_50"]
feedback_gains = [0.3, 0.7, 1.2]
correction_priors = [1.0, 3.0, 8.0]
