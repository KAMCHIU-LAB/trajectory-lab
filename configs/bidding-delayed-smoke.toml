# Software replay only: one independent confirmation market cannot establish uplift.
[study]
name = "delayed-feedback-public-smoke"
purpose = "software-reproducibility-only"
train_markets = [91001]
validation_markets = [92001]
confirmation_markets = [93001]
focal_agents = [0]
pv_count = 100000
actions = [0.0, 0.5, 1.0, 2.0, 3.0]
biases = [0.75, 1.0, 1.5]

[evaluation]
arrival_seeds = [11]
