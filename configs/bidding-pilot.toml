[study]
name = "bidding-feasibility"
purpose = "feasibility-only"
training_seeds = [11]
train_markets = [1001, 1002, 1003, 1004]
validation_markets = [2001, 2002]
test_markets = [3001, 3002, 3003, 3004]
focal_agents = [0, 16, 32]
pv_count = 50000
actions = [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
biases = [0.75, 1.0, 1.25, 1.5]

[training]
device = "mps"
threads = 2
width = 64
layers = 2
heads = 4
context = 16
steps = 1500
batch_size = 32
learning_rate = 0.0003
checkpoint_every = 500
log_every = 100

[evaluation]
scenarios = ["calibrated", "over_25", "over_50", "under_25", "mid_over_50"]
feedback_gains = [0.3, 0.7, 1.2]
correction_priors = [1.0, 3.0, 8.0]
