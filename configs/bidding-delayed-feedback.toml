[study]
name = "delayed-feedback-v1"
purpose = "custom-fixed-opponent-public-mechanism-study"
train_markets = [1001, 1002, 1003, 1004]
validation_markets = [2001, 2002, 2003, 2004, 2005, 2006]
confirmation_markets = [6101, 6102, 6103, 6104, 6105, 6106, 6107, 6108, 6109, 6110, 6111, 6112, 6113, 6114, 6115, 6116, 6117, 6118, 6119, 6120, 6121, 6122, 6123, 6124]
