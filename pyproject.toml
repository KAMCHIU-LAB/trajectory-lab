[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-lab"
version = "0.1.0"
description = "Public generative bidding and offline policy experiments with auditable evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TrajectoryLab contributors"}]
dependencies = [
  "numpy>=1.26,<3", "torch>=2.4,<3", "gymnasium>=1.0,<2",
  "scipy>=1.13,<2", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
benchmark = ["minari[hf]>=0.5,<1", "gymnasium-robotics>=1.3,<2", "mujoco>=3.1,<4", "h5py>=3.10,<4", "requests>=2.31,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
trajectorylab = "trajectorylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
